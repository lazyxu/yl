name: Temporary SQL E2E Performance Baseline
on:
  push:
    branches: [perf/sql-e2e-baseline-20261021]
concurrency:
  group: sql-performance-baseline
  cancel-in-progress: true
jobs:
  sql-api-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost -uroot -pci-only-password" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      BACKUP_TEST_MYSQL: "1"
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: node --check test/sql-performance.e2e.cjs
      - run: node test/sql-performance.e2e.cjs
      - run: SQL_PERF_OUTPUT=test-results/sql-performance-repeat.json node test/sql-performance.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-api-benchmark-twice
          path: test-results/*.json
          if-no-files-found: ignore