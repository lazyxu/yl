name: Isolated SQL 100k Backup Audit (temporary)
on:
  push:
    branches:
      - perf/sql-100k-e2e-20261021
jobs:
  backup-100k:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=30
    env:
      BACKUP_TEST_MYSQL: "1"
      BACKUP_TEST_HOST: "127.0.0.1"
      BACKUP_TEST_USER: "root"
      BACKUP_TEST_PASSWORD: "ci-only-password"
      SQL_PERF_BACKUP_RESTORE: "1"
      SQL_PERF_OUTPUT: test-results/sql-performance-100k-backup.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mysql and mysqldump clients
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends default-mysql-client
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - name: Benchmark real 100k MySQL backup, verify, restore
        run: node test/sql-performance-100k.e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sql-100k-backup
          path: test-results/sql-performance-100k-backup.json
          if-no-files-found: ignore
