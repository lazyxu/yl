name: Temporary iOS PWA offline layout audit
on:
  push:
    branches:
      - test/ios-pwa-offline-layout-audit-20261021
concurrency:
  group: ios-pwa-offline-audit
  cancel-in-progress: true
jobs:
  offline-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      E2E_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_USER: root
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: node test/browser-pwa-offline.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-layout-screenshots
          path: test-results/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint src/Calendar.jsx src/garden/GardenScreen.jsx src/garden/GardenCalendar.jsx src/garden/useGardenPlants.js src/offline/OfflinePhoto.jsx src/History.jsx src/PindouConsume.jsx
      - run: npm test -- --runInBand --testPathIgnorePatterns=recognize.image.test.js
      - run: node --test test/pindou-datetime.test.cjs test/deployment.test.cjs test/deployment-rollback.test.cjs test/garden-validation.test.cjs
      - run: npm run build
      - run: node --test test/pwa.test.cjs
  mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_USER: root
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: node --test test/backup.integration.cjs test/settings.integration.cjs test/garden.integration.cjs test/upload.integration.cjs test/pindou-stock.integration.cjs test/garden-media.test.cjs
  online-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      E2E_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_USER: root
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: node test/browser-garden.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: online-browser-failures
          path: test-results/
          if-no-files-found: ignore
