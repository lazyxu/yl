name: Temporary Garden Component Refactor Verification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npx eslint src/garden
      - run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - run: npm run build
      - run: node --test test/pwa.test.cjs
      - run: node --test test/garden-validation.test.cjs

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: '127.0.0.1'
      BACKUP_TEST_PASSWORD: 'ci-only-password'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends default-mysql-client
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: node --test test/garden-validation.test.cjs test/garden.integration.cjs test/backup.integration.cjs test/settings.integration.cjs test/pindou-stock.integration.cjs test/garden-media.test.cjs test/upload.integration.cjs
