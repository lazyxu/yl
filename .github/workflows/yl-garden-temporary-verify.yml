name: Garden archive-export PR checks
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint garden
        run: npx eslint src/garden
      - name: Jest regression
        run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - name: Node parameter regression
        run: node --test test/garden-validation.test.cjs
      - name: Vite production build
        run: npm run build
      - name: PWA integrity
        run: node --test test/pwa.test.cjs
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend and server dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
      - name: Garden MySQL regression
        run: node --test test/garden.integration.cjs
  browser:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
      E2E_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Playwright
        run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
          npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build and run real-browser garden E2E on temporary MySQL
        run: |
          npm run build
          node test/browser-garden.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: garden-browser-test-results
          path: test-results/
