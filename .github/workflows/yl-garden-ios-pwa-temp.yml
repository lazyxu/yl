name: Garden iOS PWA temporary verification
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - name: Lint garden
        run: npx eslint src/garden src/App.jsx src/gardenApi.js
      - name: All Jest regression except known OCR tests
        run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - name: Garden validation and deployment checks
        run: node --test test/garden-validation.test.cjs test/deployment.test.cjs test/deployment-rollback.test.cjs
      - name: Build
        run: npm run build
      - name: PWA validation
        run: node --test test/pwa.test.cjs
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
      - name: Garden MySQL CRUD/photo/pagination checks
        run: node --test test/garden.integration.cjs
  browser:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
      E2E_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
          npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Real Chromium/WebKit garden end-to-end checks
        run: node test/browser-garden.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: garden-ios-pwa-browser-failures
          path: test-results/
