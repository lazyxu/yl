name: Garden PR Temporary Verification

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
      - name: Lint garden modules
        run: npx eslint src/garden
      - name: Frontend Jest regression
        run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - name: Node parameter regression
        run: node --test test/garden-validation.test.cjs
      - name: Build Vite
        run: npm run build
      - name: PWA regression
        run: node --test test/pwa.test.cjs

  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
      - name: MySQL photo and timeline integration
        run: node --test test/garden.integration.cjs
