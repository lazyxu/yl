name: Temporary Real Browser E2E
on:
  push:
    branches: [test/real-browser-garden-e2e]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
      E2E_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: node test/browser-garden.e2e.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: garden-e2e-failures
          path: test-results/
          if-no-files-found: ignore
