name: Pindou history verification
on:
  pull_request:
    paths:
      - 'src/History.jsx'
      - 'src/PindouConsume.jsx'
      - 'src/Pindou.css'
      - 'server/routes/reminders.js'
      - 'server/routes/upload.js'
      - 'test/history-compact.test.jsx'
      - 'test/pindou-stock.integration.cjs'
      - 'test/upload.integration.cjs'
      - 'test/browser-garden.e2e.mjs'
      - '.github/workflows/pindou-history-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint src/History.jsx src/PindouConsume.jsx src/InventoryGrid.jsx
      - run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - run: npm run build
      - run: node --test test/pwa.test.cjs

  mysql-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: node --test test/upload.integration.cjs test/pindou-stock.integration.cjs

  browser-e2e:
    # Playwright 1.56.1 does not yet support the ubuntu-latest 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
      E2E_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: node test/browser-garden.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pindou-history-browser-failure
          path: test-results/
          if-no-files-found: ignore
