name: Pindou history verification
on:
  push:
    branches:
      - feat/pindou-history-compact-thumbnails
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint src/History.jsx src/PindouConsume.jsx src/InventoryGrid.jsx
      - run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - run: npm run build
      - run: node --test test/pwa.test.cjs

  mysql-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix server --omit=dev --package-lock=false
      - run: node --test test/upload.integration.cjs test/pindou-stock.integration.cjs
