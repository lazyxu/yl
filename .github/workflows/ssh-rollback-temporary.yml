name: Temporary SSH Rollback Verification
on:
  push:
    branches: [fix/ssh-release-atomic-rollback]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - run: bash -n release.sh release_deploy.sh backup_data.sh restore_data.sh verify_backup.sh scripts/data-command.sh scripts/activate-staged-release.sh
      - run: node --test test/deployment.test.cjs test/deployment-rollback.test.cjs test/garden-validation.test.cjs
      - run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - run: npm run build
      - run: node --test test/pwa.test.cjs
