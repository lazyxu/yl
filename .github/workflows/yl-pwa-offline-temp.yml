name: PWA offline P0 P1 P2 temporary verification
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --legacy-peer-deps
      - name: ESLint PWA and UI
        run: npx eslint src/offline src/main.jsx src/App.jsx src/Calendar.jsx src/garden
      - name: Verify server syntax
        run: node --check server/index.js
      - name: All Jest regression except existing OCR issue
        run: npm test -- --runInBand --testPathIgnorePatterns='test/(ocr|recognize.image).test.js'
      - name: Node deployment and rollback safety
        run: node --test test/deployment.test.cjs test/deployment-rollback.test.cjs
      - name: Build PWA production shell
        run: npm run build
      - name: PWA build and cache manifest checks
        run: node --test test/pwa.test.cjs
  mysql:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_MYSQL: '1'
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
      - name: Isolated MySQL garden and schedule integration
        run: node --test test/settings.integration.cjs test/garden.integration.cjs
  browser:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      BACKUP_TEST_HOST: 127.0.0.1
      BACKUP_TEST_PASSWORD: ci-only-password
      E2E_MYSQL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --legacy-peer-deps
          npm install --prefix server --omit=dev --package-lock=false
          npm install --no-save --legacy-peer-deps --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Real Browser garden calendar and PWA smoke
        run: node test/browser-garden.e2e.mjs
      - name: Real Browser PWA offline snapshots and update gates
        run: node test/browser-pwa-offline.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: yl-pwa-offline-failures
          path: test-results/
