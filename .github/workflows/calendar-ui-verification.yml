name: Temporary calendar UI verification
on:
  push:
    branches:
      - ui/calendar-remove-redundant-labels-20261021
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --runInBand
      - run: node --test test/pwa.test.cjs
      - run: npm run build
